# This is used by the action https://github.com/dorny/paths-filter (which we have forked to https://github.com/getsentry/paths-filter)

frontend_lintable:
    - "**/*.[tj]{s,sx}"
    - "**/tsconfig*.json"
    - "**/package.json"
    - "pnpm-lock.yaml"

package_json_lintable:
    - "**/package.json"
    - "package.json"

yaml_lintable:
    - "**/*.yml"
    - "**/*.yaml"
    - "pnpm-lock.yaml"

tsconfig:
    - "packages/tooling/tsconfig/**"
    - "pnpm-lock.yaml"
    - ".github/workflows/test.yml"

codecov:
    - "codecov.yml"
