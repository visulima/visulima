name: "Data Sync"

on: # yamllint disable-line rule:truthy
    schedule:
        - cron: "0 0 * * *" # At 00:00 UTC every day
    workflow_dispatch: # yamllint disable-line rule:empty-values

permissions:
    contents: "read" # for checkout

jobs:
    sync:
        name: "Sync Data Sources"
        if: "github.repository == 'visulima/visulima'"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        permissions:
            contents: "write"

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            # Persist credentials so the downstream git-auto-commit-action can push
            # using the explicitly-passed SEMANTIC_RELEASE_GITHUB_TOKEN.
            - name: "Git checkout" # zizmor: ignore[artipacked]
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  token: "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}"
              env:
                  GIT_COMMITTER_NAME: "GitHub Actions Shell"
                  GIT_AUTHOR_NAME: "GitHub Actions Shell"
                  EMAIL: "github-actions[bot]@users.noreply.github.com"

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/node@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  node-version: "24"
                  install-node-gyp: "true"
                  cache-prefix: "data-sync"
                  install-packages: "true"
                  # TODO: re-enable once pnpm/npm audit works with unpublished @visulima/task-runner-binding-* packages and pnpm registry config
                  run-npm-audit: false
                  # `npm audit signatures` walks the whole lockfile with npm, which cannot resolve the
                  # `jsr:` deps (@std/bytes, @std/html) — npm looks up @jsr/* on registry.npmjs.org and
                  # 404s. pnpm resolves them fine via npm.jsr.io, so this only breaks the audit step.
                  run-signatures-audit: false

            - name: "Sync disposable email domains"
              if: "success()"
              working-directory: "packages/email/disposable-email-domains"
              run: "pnpm run --filter disposable-email-domains generate:domains"

            # Only the disposable domains README is tracked. The generated domain
            # list lands in disposable-email-domains/dist/, which is gitignored and
            # shipped from the npm tarball — listing it here stages nothing. Leave
            # skip_dirty_check off so a run that produces no diff is a no-op instead
            # of failing on an empty `git commit`.
            - name: "Commit data updates"
              if: "success()"
              uses: "stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c" # v7.2.1
              with:
                  file_pattern: |
                      packages/email/disposable-email-domains/README.md
                  commit_message: "fix: sync data sources (disposable email domains)"
                  commit_user_name: "github-actions-shell"
                  commit_user_email: "github-actions[bot]@users.noreply.github.com"
                  commit_author: "github-actions-shell <github-actions[bot]@users.noreply.github.com>"
