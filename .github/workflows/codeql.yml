name: "CodeQL"
on:
    push:
        branches: ["main", "alpha", "next", "beta"]
    pull_request:
        branches: ["main", "alpha", "next", "beta"]
    schedule:
        - cron: "0 0 * * 1"

# Supersede stale pull-request scans, but let push and scheduled scans run to
# completion: their SARIF upload is what feeds the security alerts.
concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

permissions: {}
jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
        with:
            languages: "[\"javascript-typescript\"]"
            branches: "[\"main\", \"alpha\", \"next\", \"beta\"]"
