name: "Preview Release"

on: # yamllint disable-line rule:truthy
    pull_request:
        branches:
            - "main"
            - "alpha"
            - "next"
            - "beta"

permissions:
    contents: "read" # to fetch code (actions/checkout)

# to the same PR should supersede the in-flight preview rather than stack on it.
concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: true

env:
    NX_BRANCH: "${{ github.event.number }}"
    NX_RUN_GROUP: "${{ github.run_id }}"
    HEAD_REF: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"
    HEAD_REPOSITORY: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}"

jobs:
    preview:
        name: "Preview Release"
        # false) or write the PR comment, so they'd only fail.
        if: "github.repository == 'visulima/visulima' && github.event.pull_request.head.repo.full_name == github.repository"
        runs-on: "ubuntu-latest"
        # Wait-for-Build-Native can burn up to 55 min when runner queues
        # back up; the publish step is fast (~3 min). 75 absorbs both
        # with cushion.
        timeout-minutes: 115
        permissions:
            # pkg-pr-new publish only writes a PR comment — it does not push commits.
            contents: "read"
            issues: "write"
            checks: "write"
            pull-requests: "write"

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false
                  # Number of commits to fetch. 0 indicates all history for all branches and tags.
                  # Pulls all commits (needed for NX)
                  fetch-depth: 0
              env:
                  GIT_COMMITTER_NAME: "GitHub Actions Shell"
                  GIT_AUTHOR_NAME: "GitHub Actions Shell"
                  EMAIL: "github-actions[bot]@users.noreply.github.com"

            - name: "Derive appropriate SHAs for base and head for `nx affected` commands"
              id: "setSHAs"
              uses: "nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c" # v5.1.0

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/node@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  node-version: "24"
                  install-node-gyp: "true"
                  cache-prefix: "preview-release"
                  # TODO: re-enable once pnpm/npm audit works with unpublished @visulima/task-runner-binding-* packages and pnpm registry config
                  run-signatures-audit: false
                  run-npm-audit: false

            - name: "Build"
              run: "pnpm run build:affected:prod:packages"

            - name: "Preview Release"
              run: "node ./scripts/publish-preview-release.js"
