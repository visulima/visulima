name: "Cleanup caches by a branch"

on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "closed"
        branches:
            - "main"
            - "next"
            - "alpha"
            - "beta"

permissions:
    contents: "read"

jobs:
    cleanup-branch-cache:
        # The reusable job requests `actions: write` to delete caches; a called
        # workflow can't exceed the caller's grant, so it must be given here.
        permissions:
            actions: "write"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/cleanup-branch-cache.yaml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
        with:
            target-repo: "visulima/visulima"
