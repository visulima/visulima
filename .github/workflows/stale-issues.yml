name: "Label Idle Issues"

on: # yamllint disable-line rule:truthy
    schedule:
        - cron: "0 0 * * *"

permissions:
    contents: "read"
    issues: "write"
    pull-requests: "write"

jobs:
    stale-issues:
        uses: "anolilab/workflows/.github/workflows/stale-issues.yml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
        with:
            target-repo: "visulima/visulima"
