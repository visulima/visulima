# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Lint"

on: # yamllint disable-line rule:truthy
    pull_request:
        types: ["opened", "synchronize"]
        branches: ["main", "alpha", "next", "beta"]
    merge_group: # yamllint disable-line rule:empty-values
    # Pushes to main lint what landed and save the Nx task cache that PR runs
    # restore from (a PR's own cache entries are scoped to its ref, so main can
    # only be warmed by main itself).
    push:
        branches: ["main"]

concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    # Don't cancel main runs mid-way: a cancelled run never saves its Nx cache.
    cancel-in-progress: "${{ github.event_name != 'push' }}"

permissions:
    actions: "read" # nx-set-shas looks up the last successful main run on push events
    contents: "read" # to fetch code (actions/checkout)

env:
    NX_BRANCH: "${{ github.event.number }}"
    NX_RUN_GROUP: "${{ github.run_id }}"
    # Bound the Nx cache that is saved/restored between runs (GitHub's 10 GB
    # cache quota is shared with the pnpm store caches).
    NX_MAX_CACHE_SIZE: "1GB"
    HEAD_REF: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"
    HEAD_REPOSITORY: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}"

jobs:
    files-changed:
        name: "Detect what files changed"
        if: "github.repository == 'visulima/visulima'"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 3
        # Map a step output to a job output. dorny/paths-filter calls the
        # GitHub API on first run, which intermittently 401s on the rotating
        # secrets.GITHUB_TOKEN — fall back to the retry step's outputs.
        outputs:
            frontend_lintable: "${{ steps.changes.outputs.frontend_lintable || steps.changes_retry.outputs.frontend_lintable }}"
            yaml_lintable: "${{ steps.changes.outputs.yaml_lintable || steps.changes_retry.outputs.yaml_lintable }}"
            package_json_lintable: "${{ steps.changes.outputs.package_json_lintable || steps.changes_retry.outputs.package_json_lintable }}"
            rust_lintable: "${{ steps.changes.outputs.rust_lintable || steps.changes_retry.outputs.rust_lintable }}"
            vis_schemas_lintable: "${{ steps.changes.outputs.vis_schemas_lintable || steps.changes_retry.outputs.vis_schemas_lintable }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main

            - name: "Check for file changes"
              uses: "dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706" # v4.0.2
              id: "changes"
              continue-on-error: true
              with:
                  token: "${{ github.token }}"
                  filters: ".github/file-filters.yml"

            - name: "Wait before retrying path filter"
              if: "steps.changes.outcome == 'failure'"
              shell: "bash"
              run: "sleep 30"

            - name: "Check for file changes (retry)"
              if: "steps.changes.outcome == 'failure'"
              uses: "dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706" # v4.0.2
              id: "changes_retry"
              with:
                  token: "${{ github.token }}"
                  filters: ".github/file-filters.yml"

    # Consolidated: eslint + types + attw (build once, lint three times)
    ts-lint:
        if: "needs.files-changed.outputs.frontend_lintable == 'true'"
        needs: "files-changed"
        name: "Lint (eslint, types, attw)"
        runs-on: "ubuntu-latest"
        # eslint + attw each walk the full affected graph; on whole-repo PRs
        # (e.g. the alpha→main promotion) that is ~40 packages and overran the
        # previous 30-minute cap, cancelling the job. 45 leaves headroom.
        timeout-minutes: 45
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main
              with:
                  fetch-depth: 0

            - name: "Derive appropriate SHAs for base and head for `nx affected` commands"
              id: "setSHAs"
              uses: "nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1" # v5.0.1

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/node@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # v19.0.4 # main
              with:
                  node-version: "22"
                  install-node-gyp: "true"
                  cache-prefix: "lint"
                  # Replaced by the explicit Nx cache restore/save steps below.
                  enable-nx-cache: "false"
                  run-npm-audit: true
                  # TODO: re-enable once npm arborist fixes alias-name + installed-version mismatch for npm: aliases (e.g. vite-plugin-inspect's "vite": "npm:rolldown-vite@...")
                  run-signatures-audit: false

            # Nx task cache: restores this branch's latest entry, falling back to
            # main's. Saved at the end even when tasks fail (Nx only caches successes).
            - name: "Restore Nx cache"
              id: "nx-cache"
              uses: "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: ".nx/cache"
                  key: "nx-lint-ts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
                  restore-keys: |
                      nx-lint-ts-

            - name: "Build"
              run: "pnpm run build:affected:packages"

            # eslint, tsc and attw all read the same built outputs and share no
            # mutable state, so they run concurrently via the `parallel:` step
            # group (each runs in the background with an implicit wait-all at the
            # group's end). The job still fails if any one of them fails.
            - parallel:
                  - name: "lint eslint"
                    run: "pnpm run lint:affected:eslint"

                  - name: "lint typescript types"
                    run: "pnpm run lint:affected:types"

                  - name: "lint attw"
                    run: "pnpm run lint:affected:attw"

            - name: "Save Nx cache"
              if: "${{ !cancelled() }}"
              uses: "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: ".nx/cache"
                  key: "${{ steps.nx-cache.outputs.cache-primary-key }}"

    # fallow codebase-intelligence over the affected graph. `health` is a report
    # (prints each project's score, exits 0) — it surfaces dead code / dupes /
    # complexity drift without blocking merges. fetch-depth 0 so `nx affected`
    # can diff against the base ref. No build needed — fallow is static source
    # analysis.
    fallow:
        if: "needs.files-changed.outputs.frontend_lintable == 'true'"
        needs: "files-changed"
        name: "Lint (fallow)"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main
              with:
                  fetch-depth: 0

            - name: "Derive appropriate SHAs for base and head for `nx affected` commands"
              id: "setSHAs"
              uses: "nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1" # v5.0.1

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/node@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # v19.0.4 # main
              with:
                  node-version: "22"
                  install-node-gyp: "true"
                  cache-prefix: "lint"
                  run-npm-audit: true
                  # TODO: re-enable once npm arborist fixes alias-name + installed-version mismatch for npm: aliases (e.g. vite-plugin-inspect's "vite": "npm:rolldown-vite@...")
                  run-signatures-audit: false

            - name: "Run fallow health"
              run: "pnpm run fallow:affected:health"

    package-json-lint:
        if: "needs.files-changed.outputs.package_json_lintable == 'true'"
        needs: "files-changed"
        name: "Lint (package.json)"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main
              with:
                  fetch-depth: 0

            - name: "Derive appropriate SHAs for base and head for `nx affected` commands"
              id: "setSHAs"
              uses: "nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1" # v5.0.1

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/node@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # v19.0.4 # main
              with:
                  node-version: "22"
                  install-node-gyp: "true"
                  cache-prefix: "lint"
                  # Replaced by the explicit Nx cache restore/save steps below.
                  enable-nx-cache: "false"
                  run-npm-audit: true
                  # TODO: re-enable once npm arborist fixes alias-name + installed-version mismatch for npm: aliases (e.g. vite-plugin-inspect's "vite": "npm:rolldown-vite@...")
                  run-signatures-audit: false

            # Nx task cache: restores this branch's latest entry, falling back to
            # main's. Saved at the end even when tasks fail (Nx only caches successes).
            - name: "Restore Nx cache"
              id: "nx-cache"
              uses: "actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: ".nx/cache"
                  key: "nx-lint-package-json-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
                  restore-keys: |
                      nx-lint-package-json-

            - name: "Build"
              run: "pnpm run build:affected:packages"

            - name: "lint package.json"
              run: "pnpm run lint:affected:package-json"

            - name: "Save Nx cache"
              if: "${{ !cancelled() }}"
              uses: "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: ".nx/cache"
                  key: "${{ steps.nx-cache.outputs.cache-primary-key }}"

    vis-schemas-drift:
        if: "needs.files-changed.outputs.vis_schemas_lintable == 'true'"
        needs: "files-changed"
        name: "Lint (vis schemas drift)"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/node@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # v19.0.4 # main
              with:
                  node-version: "22"
                  install-node-gyp: "true"
                  cache-prefix: "lint"
                  run-npm-audit: true
                  # TODO: re-enable once npm arborist fixes alias-name + installed-version mismatch for npm: aliases (e.g. vite-plugin-inspect's "vite": "npm:rolldown-vite@...")
                  run-signatures-audit: false

            - name: "Build vis upstream deps"
              # Schema generation walks the workspace type graph: VisTargetConfiguration
              # extends @visulima/task-runner's TargetConfiguration, so we need that
              # package's d.ts on disk for ts-json-schema-generator to see its fields.
              run: "pnpm --filter '@visulima/vis^...' run build"

            - name: "Regenerate vis schemas and fail on drift"
              run: |
                  pnpm --filter @visulima/vis run check:schemas-drift || {
                      echo "::error::vis schemas are out of sync with src/config/types.ts. Run: pnpm --filter @visulima/vis run generate:schemas, then commit the changes under packages/tooling/vis/schemas/."
                      exit 1
                  }

    yaml-lint:
        if: "needs.files-changed.outputs.yaml_lintable == 'true'"
        needs: "files-changed"
        name: "Lint (yaml)"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main

            - name: "Lint YAML files"
              uses: "ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c" # v3.1.1
              with:
                  config_file: ".yamllint.yaml"
                  file_or_dir: "."
                  strict: true

    lint-workflows:
        if: "needs.files-changed.outputs.yaml_lintable == 'true'"
        needs: "files-changed"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main

            - name: "Lint github workflows"
              # raven-actions/actionlint shells out to `npm install @actions/tool-cache`
              # in the repo root, which trips on our pnpm workspace catalog: deps.
              # Download the actionlint release tarball directly and verify it
              # against the published checksum before executing.
              shell: "bash"
              run: |
                  set -euo pipefail
                  version="1.7.12"
                  base="https://github.com/rhysd/actionlint/releases/download/v${version}"
                  tarball="actionlint_${version}_linux_amd64.tar.gz"
                  checksums="actionlint_${version}_checksums.txt"

                  # A single-shot fetch makes this job fail whenever the release CDN
                  # hiccups; it has died on both `curl: (56)` and 503. --retry alone
                  # skips transport-level errors, so --retry-all-errors is needed to
                  # cover the connection-died case.
                  fetch() {
                      curl --fail --silent --show-error --location \
                          --retry 5 --retry-delay 2 --retry-all-errors \
                          --connect-timeout 10 --max-time 120 \
                          --output "$1" "$2"
                  }

                  fetch "$tarball" "${base}/${tarball}"
                  fetch "$checksums" "${base}/${checksums}"

                  grep " ${tarball}\$" "$checksums" | sha256sum --check --status

                  tar -xzf "$tarball" actionlint
                  rm -f "$tarball" "$checksums"

                  ./actionlint -color -shellcheck=

    rust-fmt:
        if: "needs.files-changed.outputs.rust_lintable == 'true'"
        needs: "files-changed"
        name: "Lint (rustfmt)"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main

            - name: "Install Rust toolchain"
              uses: "oxc-project/setup-rust@3d6fb132fbe7cdcb66bf8ec193911c2945369d12" # v1.0.17
              with:
                  components: "rustfmt"
                  restore-cache: false

            - name: "Check formatting (task-runner)"
              run: "cargo fmt --check --manifest-path packages/tooling/task-runner/native/Cargo.toml"

            - name: "Check formatting (tui)"
              run: "cargo fmt --check --manifest-path packages/terminal/tui/native/Cargo.toml"

            - name: "Check formatting (vis)"
              run: "cargo fmt --check --manifest-path packages/tooling/vis/native/Cargo.toml"

    # Single aggregated required check for branch protection — mirrors test.yml's
    # "Check Test Run". `if: always()` so it runs even when lint jobs are skipped
    # (file-filtered); the step fails red only if a dependency actually failed,
    # so a genuine lint failure blocks the merge.
    lint-required-check:
        needs: ["files-changed", "ts-lint", "fallow", "package-json-lint", "vis-schemas-drift", "yaml-lint", "lint-workflows", "rust-fmt"]
        name: "Check Lint Run"
        if: "always()"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 30
        steps:
            # If any jobs we depend on fail, we will fail since this is a required check.
            # NOTE: A timeout is considered a failure.
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Check for failures"
              if: "contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')"
              run: |
                  echo "One of the dependent jobs have failed. You may need to re-run it." && exit 1
