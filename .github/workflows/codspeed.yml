# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "CodSpeed"

on: # yamllint disable-line rule:truthy
    push:
        branches: ["main", "alpha"]
    pull_request:
        types: ["opened", "synchronize", "reopened"]
        branches: ["main", "alpha", "next", "beta"]
    workflow_dispatch: # yamllint disable-line rule:empty-values

concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    actions: "read" # to find this commit's Tests / Preview Release runs and Build Native artifacts
    contents: "read"
    checks: "read" # to poll Check Native Build via gh api

env:
    NX_BRANCH: "${{ github.event.number || github.ref_name }}"
    NX_RUN_GROUP: "${{ github.run_id }}"

jobs:
    discover:
        name: "Discover affected benches"
        runs-on: "ubuntu-latest"
        # Waits for Build Native (up to 80 min on saturated runner queues) and
        # then for this commit's Tests / Preview Release (up to 120 min) before
        # the ~2 min of discovery itself.
        timeout-minutes: 210
        outputs:
            matrix: "${{ steps.affected.outputs.matrix }}"
            has-benches: "${{ steps.affected.outputs.has-benches }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main
              with:
                  fetch-depth: 0

            - name: "Wait for Build Native"
              uses: "./.github/actions/wait-for-native-build"
              with:
                  ref: "${{ github.event.pull_request.head.sha || github.sha }}"
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            # Benchmarks run last: wait until this commit's Tests (and, on PRs, the
            # Preview Release) have finished, so the bench matrix doesn't compete with
            # them for runners. Proceeds whatever their outcome; a workflow that never
            # starts (e.g. filtered out) stops being waited for after 10 minutes.
            - name: "Wait for Tests and Preview Release"
              shell: "bash"
              env:
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
                  REF: "${{ github.event.pull_request.head.sha || github.sha }}"
                  REPO: "${{ github.repository }}"
                  EVENT: "${{ github.event_name }}"
              run: |
                  set -euo pipefail
                  case "$EVENT" in
                      pull_request) workflows=("Tests" "Preview Release") ;;
                      push) workflows=("Tests") ;;
                      *) echo "Nothing to wait for on ${EVENT}"; exit 0 ;;
                  esac
                  started=$(date +%s)
                  while :; do
                      # Transient API errors (token blips) just mean "poll again".
                      runs=$(gh api -X GET "repos/${REPO}/actions/runs" -f head_sha="$REF" --paginate --jq '.workflow_runs[] | [.name, .id, .status, (.conclusion // "")] | @tsv' 2>/dev/null || true)
                      pending=0
                      missing=()
                      for name in "${workflows[@]}"; do
                          latest=$(printf '%s\n' "$runs" | awk -F'\t' -v n="$name" '$1 == n' | sort -t$'\t' -k2,2n | tail -n 1)
                          if [ -z "$latest" ]; then
                              missing+=("$name")
                          elif [ "$(cut -f3 <<<"$latest")" != "completed" ]; then
                              pending=$((pending + 1))
                          fi
                      done
                      elapsed=$(( $(date +%s) - started ))
                      if [ "$pending" -eq 0 ] && { [ "${#missing[@]}" -eq 0 ] || [ "$elapsed" -ge 600 ]; }; then
                          [ "${#missing[@]}" -eq 0 ] || echo "Not waiting for workflow(s) that never started: ${missing[*]}"
                          echo "Tests / Preview Release finished; starting benchmarks"
                          exit 0
                      fi
                      if [ "$elapsed" -ge 7200 ]; then
                          echo "Timed out after 120 minutes waiting for Tests / Preview Release"
                          exit 1
                      fi
                      echo "Waiting: ${pending} running, missing: ${missing[*]:-none}"
                      sleep 30
                  done

            - name: "Derive appropriate SHAs for base and head for `nx affected` commands"
              id: "setSHAs"
              uses: "nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1" # v5.0.1

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/node@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # v19.0.4 # main
              with:
                  node-version: "24"
                  install-node-gyp: "true"
                  skip-playwright: "true"
                  # TODO: re-enable once pnpm/npm audit works with unpublished @visulima/task-runner-binding-* packages and pnpm registry config
                  run-signatures-audit: false
                  run-npm-audit: false

            - name: "Compute affected bench projects"
              id: "affected"
              shell: "bash"
              run: |
                  # `pnpm exec` leaks workspace platform-mismatch warnings to stdout
                  # (one line per native NAPI sub-package). Keep only the JSON line.
                  affected=$(pnpm exec nx show projects --affected --withTarget=test:bench --json 2>/dev/null | grep -E '^\[' | tail -n 1)
                  affected=${affected:-'[]'}

                  if [ -z "$affected" ] || [ "$affected" = "[]" ]; then
                    echo "No affected bench projects."
                    echo "has-benches=false" >> "$GITHUB_OUTPUT"
                    echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  matrix=$(echo "$affected" | jq -c '{include: [.[] | {project: .}]}')

                  echo "Affected bench projects: $affected"
                  echo "has-benches=true" >> "$GITHUB_OUTPUT"
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    benchmark:
        name: "Bench: ${{ matrix.project }}"
        needs: "discover"
        if: "${{ needs.discover.outputs.has-benches == 'true' }}"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        # Scope the CodSpeed OIDC token to an environment so secrets and reviewer
        # rules (configured in repo settings) can apply to benchmark uploads.
        environment: "benchmarks"
        permissions:
            contents: "read"
            id-token: "write" # required for OIDC authentication with CodSpeed
        strategy:
            fail-fast: false
            matrix: "${{ fromJSON(needs.discover.outputs.matrix) }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920" # v2.20.0
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # main

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/node@aa162a984a4909f412bc4dbae712def066a0a681" # v20.2.5 # v19.0.4 # main
              with:
                  node-version: "24"
                  install-node-gyp: "true"
                  skip-playwright: "true"
                  # TODO: re-enable once pnpm/npm audit works with unpublished @visulima/task-runner-binding-* packages and pnpm registry config
                  run-signatures-audit: false
                  run-npm-audit: false

            # Host-matching native bindings from this commit's Build Native run, so
            # benches that need a compiled binding (tui, task-runner, …) can load it.
            - name: "Native test artifacts"
              uses: "./.github/actions/native-test-artifacts"
              with:
                  ref: "${{ github.event.pull_request.head.sha || github.sha }}"
                  github-token: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Build only this bench's library dependencies"
              env:
                  BENCH_PROJECT: "${{ matrix.project }}"
              shell: "bash"
              run: |
                  pnpm exec nx graph --focus="$BENCH_PROJECT" --file=/tmp/bench-graph.json >/dev/null
                  focused=$(jq -r '.graph.nodes | keys[]' /tmp/bench-graph.json | sort -u)
                  buildable=$(pnpm exec nx show projects --withTarget=build:prod --json | grep -E '^\[' | tail -n 1 | jq -r '.[]' | sort -u)
                  deps=$(comm -12 <(echo "$focused") <(echo "$buildable") | paste -sd, -)

                  if [ -z "$deps" ]; then
                    echo "No buildable deps for $BENCH_PROJECT, skipping build."
                    exit 0
                  fi

                  echo "Building deps for $BENCH_PROJECT: $deps"
                  pnpm exec nx run-many --target=build:prod --projects="$deps" --nxBail

            - name: "Run benchmark"
              env:
                  BENCH_PROJECT: "${{ matrix.project }}"
              uses: "CodSpeedHQ/action@f99becdce5e5d51fd556489ebef684f4ecfd6286" # v4.18.5
              with:
                  mode: "simulation"
                  run: "pnpm exec nx run \"$BENCH_PROJECT\":test:bench"
