# Runs @visulima/storage's live tests (the storage contract and the upload handlers end to end), and
# @visulima/storage-client's adapters against those handlers, against real services started from
# packages/storage/storage/docker-compose.live.yml: MinIO and SeaweedFS for S3Storage and
# AwsLightStorage, Azurite, fake-gcs-server, an SFTP and an FTP server, Apache mod_dav (WebDAV),
# PocketBase and Supabase's storage-api. The fakes the regular test job uses can't show how a real
# service answers; this job does.

name: "Storage Live Tests"

on: # yamllint disable-line rule:truthy
    pull_request:
        types: ["opened", "synchronize", "reopened"]
        branches: ["main"]
        paths:
            - "packages/storage/storage/**"
            - "packages/storage/storage-client/**"
            - ".github/workflows/storage-live.yml"
    push:
        branches: ["main"]
        paths:
            - "packages/storage/storage/**"
            - "packages/storage/storage-client/**"
            - ".github/workflows/storage-live.yml"
    workflow_dispatch: # yamllint disable-line rule:empty-values

concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

permissions:
    contents: "read" # to fetch code (actions/checkout)

jobs:
    storage-live:
        name: "Storage live tests"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        env:
            COMPOSE_FILE: "packages/storage/storage/docker-compose.live.yml"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "anolilab/workflows/step/checkout-with-retry@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/node@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  node-version: "24"
                  install-node-gyp: "true"
                  cache-prefix: "storage-live"
                  skip-playwright: "true"
                  enable-nx-cache: "false"
                  # This job never publishes, so the provenance-only npm upgrade is unneeded.
                  upgrade-npm-version: false
                  # TODO: re-enable once pnpm/npm audit works with unpublished @visulima/task-runner-binding-* packages.
                  run-signatures-audit: false
                  run-npm-audit: false

            # The tests import the package from src/; its workspace dependencies resolve through dist/.
            - name: "Build workspace dependencies"
              run: "pnpm --filter \"@visulima/storage^...\" run build"

            # The client tests serve the storage package's handlers from its dist/.
            - name: "Build @visulima/storage"
              run: "pnpm --filter \"@visulima/storage\" run build"

            # Blocks until every service passes its health check.
            - name: "Start services"
              run: "docker compose up --detach --wait"

            - name: "Run live tests"
              run: "pnpm --filter \"@visulima/storage\" run test:live"
              env:
                  LIVE_TESTS: "1"

            - name: "Run client live tests"
              run: "pnpm --filter \"@visulima/storage-client\" run test:live"
              env:
                  LIVE_TESTS: "1"

            - name: "Service logs"
              if: "${{ failure() }}"
              run: "docker compose logs"

            - name: "Stop services"
              if: "${{ always() }}"
              run: "docker compose down --volumes"
